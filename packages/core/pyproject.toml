[project]
name = "cs-core"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "psycopg[binary,pool]>=3.2.0",
    "PyJWT>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core"]
