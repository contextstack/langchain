[project]
name = "cs-mcp-servers"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "cs-core",
    "cs-knowledge",
    "fastmcp>=2.0.0",
]

[project.scripts]
ops-mcp-infra = "mcp_servers.infra_server:run"
ops-mcp-ticketing = "mcp_servers.ticketing_server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_servers"]
