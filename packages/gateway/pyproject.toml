[project]
name = "cs-gateway"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "cs-core",
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-openai>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]
