[project]
name = "cs-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "cs-core",
    "cs-workflows",
    "cs-telemetry",
    "redis>=5.2.0",
]

[project.scripts]
ops-worker = "worker.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]
