[project]
name = "cs-api"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "cs-core",
    "cs-telemetry",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "redis>=5.2.0",
]

[project.scripts]
ops-api = "api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
