[project]
name = "cs-cli"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "cs-core",
    "cs-gateway",
    "cs-knowledge",
    "cs-workflows",
    "typer>=0.15.0",
    "httpx>=0.28.0",
]

[project.scripts]
ops-cli = "cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli"]
